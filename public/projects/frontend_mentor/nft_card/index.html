<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="stylesheet" href="./css/general-styling.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Camingo+Code:wght@400;700&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Titillium+Web:wght@400;700&family=Dancing+Script&family=Fira+Code:wght@400;700&family=PT+Sans:wght@400;700&family=IBM+Plex+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <div id="menu-container"></div>
    <main>
      <div class="container">
        <div class="card">
          <div class="card__image">
            <a href="#"><img src="./images/image-equilibrium.jpg" alt="" /></a>
          </div>
          <div class="card__content">
            <h1 class="card__content__title">
              <a href="">Equilibrium #3429</a>
            </h1>
            <p class="card__content__body">Our Equilibrium collection promotes balance and calm.</p>
            <div class="card__eth__time">
              <div class="card__eth">
                <img src="./images/icon-ethereum.svg" alt="" />
                <p>0.041 ETH</p>
              </div>
              <div class="card__time">
                <img src="./images/icon-clock.svg" alt="" />
                <p>3 days left</p>
              </div>
            </div>
          </div>
          <hr />
          <div class="card__creator">
            <img src="./images/image-avatar.png" alt="" />
            <p>
              Creation of
              <span><a href="#">Jules Wyvern</a></span>
            </p>
          </div>
          <div class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>
            . Coded by
            <a href="#">Colin McArthur</a>
            .
          </div>
        </div>
      </div>
    </main>
    <script src="../../../assets/js/components/header.js"></script>
  </body>
</html>
