<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" /></noscript>
    <title>Frontend Mentor | Results summary component</title>
  </head>

  <body>
    <div id="menu-container" style="min-height: clamp(5.75rem, 8vw, 6.75rem); display: block"></div>
    <section class="results">
      <article class="results__summary gradient--light-slate-to-light-royal">
        <h2 class="results__title">Your Result</h2>
        <div class="results__circle">
          <span class="results__score">76</span>
          <span class="results__out-of">of 100</span>
        </div>
        <p class="results__feedback">Great!</p>
        <p class="results__details">You scored higher than 65% of the people who have taken these tests.</p>
      </article>

      <article class="results__detailed">
        <h3>Summary</h3>
        <div class="results__score-container" data-quality="reaction">
          <span class="results__quality">Reaction</span>
          <span class="results__score-value">80 / 100</span>
        </div>
        <div class="results__score-container" data-quality="memory">
          <span class="results__quality">Memory</span>
          <span class="results__score-value">92 / 100</span>
        </div>
        <div class="results__score-container" data-quality="verbal">
          <span class="results__quality">Verbal</span>
          <span class="results__score-value">61 / 100</span>
        </div>
        <div class="results__score-container" data-quality="visual">
          <span class="results__quality">Visual</span>
          <span class="results__score-value">72 / 100</span>
        </div>
        <button>Continue</button>
      </article>
    </section>

    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>
        . Coded by
        <a href="#">Your Name Here</a>
        .
      </div>
    </footer>
    <script src="../../../assets/js/components/header.js"></script>
  </body>
</html>
