<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- <link rel="stylesheet" href="css/normalize.css" /> -->
    <link rel="stylesheet" href="../../../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Camingo+Code:wght@400;700&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Titillium+Web:wght@400;700&family=Dancing+Script&family=Fira+Code:wght@400;700&family=PT+Sans:wght@400;700&family=IBM+Plex+Serif:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Stats preview card component 1</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div id="menu-container" style="min-height: clamp(5.75rem, 8vw, 6.75rem); display: block"></div>
    <section>
      <div class="card">
        <div class="card__content">
          <h2 class="card__content-heading">
            Get
            <span class="accent">insights</span>
            that help your business grow.
          </h2>
          <p class="card__content-body">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
          <div class="card__content-stats">
            <div class="flex-col">
              <div class="stats-heading">10k+</div>
              <span>COMPANIES</span>
            </div>
            <div class="flex-col">
              <div class="stats-heading">314</div>
              <span>TEMPLATES</span>
            </div>
            <div class="flex-col">
              <div class="stats-heading">12m+</div>
              <span>QUERIES</span>
            </div>
          </div>
        </div>
        <div class="card__image-wrapper">
          <img class="card__image" src="../../stats_card/public/images/image-header-desktop.jpg" />
        </div>
      </div>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>
        . Coded by
        <a href="#">Colin McArthur</a>
        .
      </div>
    </section>
    <script src="../../../../assets/js/components/header.js"></script>
  </body>
</html>
