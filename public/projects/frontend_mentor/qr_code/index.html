<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/global-styles.css" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="../../../assets/css/style.css" />
    <link rel="icon" href="images/image-qr-code.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" /></noscript>
    <title>QR Code Component - Colin McArthur</title>
  </head>
  <body>
    <div id="menu-container" style="min-height: clamp(5.75rem, 8vw, 6.75rem); display: block"></div>
    <main>
      <div class="card__container">
        <div class="card__items">
          <img src="images/image-qr-code.png" alt="This is a QR code" />
          <div class="card__text">
            <div class="card__headline">
              <h1>Improve your front-end skills by building projects</h1>
            </div>
            <div class="card__body">
              <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="../../../assets/js/components/header.js"></script>
  </body>
</html>
