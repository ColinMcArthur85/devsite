<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0070f3" />
    <link rel="stylesheet" href="../../../styles/tailwind.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&family=Fira+Code:wght@400;700&display=swap" /></noscript>
    <title>Image Search Engine | Unsplash API</title>
  </head>
  <body class="dark:bg-dark-background bg-white font-sans text-gray-900 transition-colors duration-300 dark:text-white">
    <!-- Dark mode background gradients -->
    <div class="pointer-events-none fixed inset-0 -z-10 opacity-0 transition-opacity duration-500 dark:opacity-100">
      <div class="absolute inset-0 bg-linear-to-br from-primary/10 via-transparent to-secondary/10"></div>
    </div>
    <!-- Header loaded via JS -->
    <div id="menu-container" style="min-height: clamp(5.75rem, 8vw, 6.75rem); display: block"></div>
    <main>
      <section class="hero-search">
        <h1 class="dark:text-white text-gray-900">Image Search Engine</h1>
        <form id="search-form" action="">
          <input type="text" id="search-box" placeholder="Search anything here..." />
          <button>Search</button>
        </form>
        <div class="controls-row">
          <label>
            Orientation
            <select id="filter-orientation">
              <option value="">Any</option>
              <option value="landscape">Landscape</option>
              <option value="portrait">Portrait</option>
              <option value="squarish">Square</option>
            </select>
          </label>
          <label>
            Color
            <select id="filter-color">
              <option value="">Any</option>
              <option value="black_and_white">B&W</option>
              <option value="black">Black</option>
              <option value="white">White</option>
              <option value="yellow">Yellow</option>
              <option value="orange">Orange</option>
              <option value="red">Red</option>
              <option value="purple">Purple</option>
              <option value="magenta">Magenta</option>
              <option value="green">Green</option>
              <option value="teal">Teal</option>
              <option value="blue">Blue</option>
            </select>
          </label>
          <label>
            Order
            <select id="filter-order">
              <option value="relevant">Relevant</option>
              <option value="latest">Latest</option>
            </select>
          </label>
          <label>
            Per page
            <select id="filter-per-page">
              <option value="9">9</option>
              <option value="12" selected>12</option>
              <option value="15">15</option>
            </select>
          </label>
        </div>
        <p id="status-message" aria-live="polite"></p>
        <div id="search-result"></div>
        <button id="show-more-btn">Show more</button>
        <p class="attribution dark:text-white text-gray-900">
          Built following
          <a href="https://www.youtube.com/watch?v=E4znbZgUWzA" target="_blank" rel="noopener noreferrer">GreatStack's tutorial</a>
          . Images provided by the
          <a href="https://unsplash.com/developers" target="_blank" rel="noopener noreferrer">Unsplash API</a>
          .
        </p>
      </section>
    </main>
    <script type="module" src="../../../js/components/header.js"></script>
    <script src="./script.js" defer></script>
    <script type="module" src="../../../js/scripts.js"></script>
    <script type="module" src="../../../js/components/ui.js"></script>
  </body>
</html>
