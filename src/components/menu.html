<header class="relative top-0 z-50 w-full">
  <script>
    // Default to dark for new visitors. Respect light only when explicitly stored.
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light") {
        document.documentElement.classList.remove("dark");
      } else {
        // theme === "dark" OR no stored value -> default dark
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
